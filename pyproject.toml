[project]
name = "style-dna-ghostwriter"
version = "0.2.0"
description = "Learns a codebase's unwritten conventions and ghostwrites new code that matches them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kaifazad", email = "hello@kaifazad.in" }
]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "code-style", "conventions", "ghostwriter", "ai-coding",
    "style-guide", "mcp", "claude", "cursor", "copilot",
    "react", "nextjs", "tailwind", "python", "typescript",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://kaifazad.in"
Repository = "https://github.com/kaifazad/style-dna-ghostwriter"
Documentation = "https://github.com/kaifazad/style-dna-ghostwriter#readme"
Issues = "https://github.com/kaifazad/style-dna-ghostwriter/issues"

[project.optional-dependencies]
generate = ["anthropic>=0.34.0"]
mcp = ["mcp>=1.9.0"]
guard = ["pathspec>=0.12.1"]
treesitter = ["tree-sitter>=0.23.0", "tree-sitter-typescript>=0.23.0"]
dev = ["pytest>=7.0", "pathspec>=0.12.1"]
all = ["anthropic>=0.34.0", "mcp>=1.9.0", "pathspec>=0.12.1"]

[project.scripts]
style-dna = "style_dna.cli:main"
style-dna-ghostwriter = "style_dna.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["style_dna*"]
