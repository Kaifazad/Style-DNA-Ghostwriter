<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background / Ambient Glow Gradients -->
    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="dnaGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Code Bracket '{' -->
  <path d="M 44 54 C 36 54 32 58 32 66 L 32 90 C 32 96 28 100 22 100 C 28 100 32 104 32 110 L 32 134 C 32 142 36 146 44 146" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Right Code Bracket '}' -->
  <path d="M 156 54 C 164 54 168 58 168 66 L 168 90 C 168 96 172 100 178 100 C 172 100 168 104 168 110 L 168 134 C 168 142 164 146 156 146" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- DNA Horizontal Base Pair Rungs -->
  <line x1="78" y1="46" x2="122" y2="46" stroke="url(#dnaGrad1)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <line x1="72" y1="70" x2="128" y2="70" stroke="url(#dnaGrad2)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <line x1="82" y1="130" x2="118" y2="130" stroke="url(#dnaGrad1)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <line x1="76" y1="154" x2="124" y2="154" stroke="url(#dnaGrad2)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

  <!-- DNA Strand A -->
  <path d="M 74 36 C 74 70 126 76 126 100 C 126 124 74 130 74 164" 
        fill="none" 
        stroke="url(#dnaGrad1)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#softGlow)" />

  <!-- DNA Strand B -->
  <path d="M 126 36 C 126 70 74 76 74 100 C 74 124 126 130 126 164" 
        fill="none" 
        stroke="url(#dnaGrad2)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#softGlow)" />

  <!-- Center Ghostwriter Pen Nib / Diamond Quill -->
  <g transform="translate(100, 100) rotate(-45)">
    <!-- Nib Body -->
    <path d="M 0 -26 L 16 0 L 0 28 L -16 0 Z" 
          fill="url(#nibGrad)" 
          stroke="#38bdf8" 
          stroke-width="1.5" 
          filter="url(#softGlow)" />
    <!-- Nib Slit line -->
    <line x1="0" y1="4" x2="0" y2="28" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Breather Hole -->
    <circle cx="0" cy="4" r="2.5" fill="#0f172a" />
    <!-- Ink Tip Glow Dot -->
    <circle cx="0" cy="28" r="1.5" fill="#38bdf8" />
  </g>
</svg>
